task: regression
target_property: null
feature_groups:
  - composition
  - structure

models:
  random_forest:
    estimator: RandomForestRegressor
    parameters:
      n_estimators: 200
      random_state: 42
      n_jobs: -1
  gradient_boosting:
    estimator: GradientBoostingRegressor
    parameters:
      n_estimators: 100
      learning_rate: 0.05
      random_state: 42
  ridge:
    estimator: Ridge
    parameters:
      alpha: 1.0

evaluation:
  test_size: 0.2
  random_state: 42
  cross_validation_folds: 5
  scoring: neg_root_mean_squared_error
