[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manganeseai"
version = "0.1.0"
description = "An explainable AI-guided discovery platform for manganese-based battery cathodes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "NonyLab-86" }]
dependencies = [
    "alembic>=1.13,<2",
    "ase",
    "matminer",
    "matplotlib",
    "mp-api>=0.41,<1",
    "numpy",
    "pandas",
    "plotly",
    "pymatgen>=2024.5,<2027",
    "PyYAML>=6.0,<7",
    "scikit-learn",
    "scipy",
    "shap",
    "SQLAlchemy>=2.0,<2.1",
    "streamlit",
    "xgboost",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["manganeseai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
